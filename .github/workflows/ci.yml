name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || pip install fastapi uvicorn sqlalchemy xgboost scikit-learn pandas numpy
      - name: Lint
        working-directory: backend
        run: |
          pip install flake8
          flake8 src/ --max-line-length=120 --exclude=__pycache__ --count --statistics || true
      - name: Run tests
        working-directory: backend
        run: PYTHONPATH=. python -m pytest tests/ -v --tb=short || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install and build
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps
          npm run build --if-present
